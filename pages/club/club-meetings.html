<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings - Code4Good | Yale Clubs</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <!-- Navigation Bar will be inserted by JavaScript -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="dashboard-content">
        <div class="owner-panel">
            <!-- Header Section -->
            <div class="owner-header">
                <div>
                    <h1 class="owner-title">Owner Panel</h1>
                    <p class="owner-subtitle">Managing: Code4Good</p>
                </div>
                <button class="btn-view-public">View Public Page</button>
            </div>

            <!-- Meeting Schedule Section -->
            <div class="meeting-schedule-section">
                <div class="section-header-with-button">
                    <h2 class="section-heading">Meeting Schedule</h2>
                    <button class="btn-add-meeting">
                        <i class="fas fa-plus"></i>
                        Add New Meeting
                    </button>
                </div>
                
                <div class="meeting-schedule-list">
                    <!-- Meeting schedule will be loaded dynamically -->
                </div>
            </div>

            <!-- Upcoming Events Section -->
            <div class="upcoming-events-section">
                <div class="section-header-with-button">
                    <h2 class="section-heading">Upcoming Events</h2>
                    <button class="btn-add-event">
                        <i class="fas fa-plus"></i>
                        Add New Event
                    </button>
                </div>
                
                <div class="events-list">
                    <!-- Calendar events will be loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <!-- Event Modal -->
    <div id="eventModal" class="meeting-modal" style="display: none;">
        <div class="meeting-modal-content">
            <div class="meeting-modal-header">
                <h3 id="eventModalTitle">Add New Event</h3>
                <button class="event-modal-close">&times;</button>
            </div>
            <div class="meeting-modal-body">
                <form id="eventForm">
                    <div class="form-group">
                        <label for="eventTitle" class="form-label">Title</label>
                        <input type="text" id="eventTitle" name="title" class="form-input" placeholder="e.g., Weekly Debate Meeting" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDate" class="form-label">Date</label>
                        <input type="date" id="eventDate" name="date" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime" class="form-label">Time</label>
                        <input type="time" id="eventTimeInput" name="time" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="eventLocation" class="form-label">Location</label>
                        <input type="text" id="eventLocation" name="location" class="form-input" placeholder="e.g., Linsly-Chittenden Hall, Room 101" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDescription" class="form-label">Description (Optional)</label>
                        <textarea id="eventDescription" name="description" class="form-input" rows="3" placeholder="Event description..."></textarea>
                    </div>
                    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                        <button type="button" id="eventModalCancel" class="btn-secondary" style="padding: 10px 20px;">Cancel</button>
                        <button type="submit" id="eventModalSave" class="btn-primary" style="padding: 10px 20px;">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Meeting Modal -->
    <div id="meetingModal" class="meeting-modal" style="display: none;">
        <div class="meeting-modal-content">
            <div class="meeting-modal-header">
                <h3 id="meetingModalTitle">Add New Meeting</h3>
                <button class="meeting-modal-close">&times;</button>
            </div>
            <div class="meeting-modal-body">
                <form id="meetingForm">
                    <div class="form-group">
                        <label for="meetingDay" class="form-label">Day</label>
                        <select id="meetingDay" name="day" class="form-select" required>
                            <option value="">Select a day</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="meetingTime" class="form-label">Time</label>
                        <input type="text" id="meetingTime" name="time" class="form-input" placeholder="e.g., 2:00 PM - 4:00 PM" required>
                    </div>
                    <div class="form-group">
                        <label for="meetingLocation" class="form-label">Location</label>
                        <input type="text" id="meetingLocation" name="location" class="form-input" placeholder="e.g., Linsly-Chittenden Hall, Room 101" required>
                    </div>
                    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                        <button type="button" id="meetingModalCancel" class="btn-secondary" style="padding: 10px 20px;">Cancel</button>
                        <button type="submit" id="meetingModalSave" class="btn-primary" style="padding: 10px 20px;">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <style>
        .meeting-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .meeting-modal-content {
            background: white;
            border-radius: 8px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .meeting-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        .meeting-modal-header h3 {
            margin: 0;
        }
        .meeting-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .meeting-modal-close:hover {
            color: #000;
        }
        .meeting-modal-body {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1a202c;
        }
        .form-select,
        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-select:focus,
        .form-input:focus {
            outline: none;
            border-color: #4F46E5;
        }
        .form-input[type="textarea"],
        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }
        .event-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .event-modal-close:hover {
            color: #000;
        }
    </style>

    <script src="club-navbar.js"></script>
    <script src="club-meetings.js"></script>
</body>
</html>
