<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs - Yale Clubs</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <!-- Navigation Bar will be inserted by JavaScript -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="dashboard-content">
        <div class="clubs-page">
            <!-- Header Section -->
            <div class="page-header">
                <h1 class="page-title">Clubs Directory</h1>
                <p class="page-subtitle">Browse and discover clubs at Yale</p>
            </div>

            <!-- Search and Filters -->
            <div class="clubs-controls">
                <!-- Search Bar -->
                <div class="clubs-search-container">
                    <div class="clubs-search-wrapper">
                        <i class="fas fa-search clubs-search-icon"></i>
                        <input 
                            type="text" 
                            id="club-search" 
                            class="clubs-search-input" 
                            placeholder="Search clubs by name..."
                        >
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="clubs-filters">
                    <button class="club-filter-btn active" data-filter="all">All</button>
                    <button class="club-filter-btn" data-filter="open">Open Join</button>
                    <button class="club-filter-btn" data-filter="application">Application Required</button>
                </div>
            </div>

            <!-- Clubs Table -->
            <div class="clubs-table-container">
                <table class="clubs-table">
                    <thead>
                        <tr class="clubs-table-header">
                            <th class="col-name">
                                <button class="sortable-header" data-sort="name">
                                    Club Name
                                    <i class="fas fa-sort sort-icon"></i>
                                </button>
                            </th>
                            <th class="col-liaison">Owner / Liaison</th>
                            <th class="col-timeslot">Meeting Time</th>
                            <th class="col-location">Location</th>
                            <th class="col-join-type">
                                <button class="sortable-header" data-sort="joinType">
                                    Join Type
                                    <i class="fas fa-sort sort-icon"></i>
                                </button>
                            </th>
                            <th class="col-deadline">Deadline</th>
                            <th class="col-action">Action</th>
                        </tr>
                    </thead>
                    <tbody id="clubs-table-body">
                        <!-- Clubs will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Club Details Modal -->
    <div id="club-modal" class="club-modal">
        <div class="club-modal-overlay"></div>
        <div class="club-modal-content">
            <div class="club-modal-header">
                <h2 class="club-modal-title" id="club-modal-title">Club Name</h2>
                <button class="club-modal-close" id="club-modal-close" aria-label="Close modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="club-modal-body" id="club-modal-body">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script src="clubs.js"></script>
</body>
</html>
