<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar - Yale Clubs</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <!-- Navigation Bar will be inserted by JavaScript -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="dashboard-content">
        <div class="calendar-page">
            <!-- Google Calendar Style Header -->
            <div class="gcal-header">
                <div class="gcal-header-left">
                    <h1 class="gcal-title">Calendar</h1>
                    <div class="gcal-date-range" id="week-display">Week of Nov 24</div>
                </div>
                <div class="gcal-header-right">
                    <div class="gcal-view-controls">
                        <button class="gcal-view-btn active">Week</button>
                        <button class="gcal-view-btn">Month</button>
                    </div>
                    <div class="gcal-nav-controls">
                        <button class="gcal-nav-btn" id="prev-week" title="Previous week">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="gcal-nav-btn" id="today-btn" title="Today">Today</button>
                        <button class="gcal-nav-btn" id="next-week" title="Next week">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Calendar Events Section -->
            <div class="gcal-availability-section">
                <div class="gcal-availability-header">
                    <h2 class="gcal-section-title">Club Meetings</h2>
                    <p class="gcal-section-subtitle">Click on events to view details and manage your schedule.</p>
                </div>

                <!-- Google Calendar Style Grid -->
                <div class="gcal-grid-container">
                    <div class="gcal-grid">
                        <!-- Time slots column -->
                        <div class="gcal-time-column">
                            <div class="gcal-time-spacer"></div>
                            <div class="gcal-time-slot">8 AM</div>
                            <div class="gcal-time-slot">9 AM</div>
                            <div class="gcal-time-slot">10 AM</div>
                            <div class="gcal-time-slot">11 AM</div>
                            <div class="gcal-time-slot">12 PM</div>
                            <div class="gcal-time-slot">1 PM</div>
                            <div class="gcal-time-slot">2 PM</div>
                            <div class="gcal-time-slot">3 PM</div>
                            <div class="gcal-time-slot">4 PM</div>
                            <div class="gcal-time-slot">5 PM</div>
                            <div class="gcal-time-slot">6 PM</div>
                            <div class="gcal-time-slot">7 PM</div>
                            <div class="gcal-time-slot">8 PM</div>
                            <div class="gcal-time-slot">9 PM</div>
                        </div>

                        <!-- Days grid -->
                        <div class="gcal-days-grid">
                            <!-- Day headers -->
                            <div class="gcal-day-header">
                                <div class="gcal-day-name">Mon</div>
                                <div class="gcal-day-date">24</div>
                            </div>
                            <div class="gcal-day-header">
                                <div class="gcal-day-name">Tue</div>
                                <div class="gcal-day-date">25</div>
                            </div>
                            <div class="gcal-day-header">
                                <div class="gcal-day-name">Wed</div>
                                <div class="gcal-day-date">26</div>
                            </div>
                            <div class="gcal-day-header">
                                <div class="gcal-day-name">Thu</div>
                                <div class="gcal-day-date">27</div>
                            </div>
                            <div class="gcal-day-header">
                                <div class="gcal-day-name">Fri</div>
                                <div class="gcal-day-date">28</div>
                            </div>
                            <div class="gcal-day-header">
                                <div class="gcal-day-name">Sat</div>
                                <div class="gcal-day-date">29</div>
                            </div>
                            <div class="gcal-day-header">
                                <div class="gcal-day-name">Sun</div>
                                <div class="gcal-day-date">30</div>
                            </div>

                            <!-- Time slot cells (14 time slots × 7 days = 98 cells) -->
                            <!-- Monday -->
                            <div class="gcal-time-cell" data-day="monday" data-time="8"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="9"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="10"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="11"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="12"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="13"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="14"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="15"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="16"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="17"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="18"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="19"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="20"></div>
                            <div class="gcal-time-cell" data-day="monday" data-time="21"></div>

                            <!-- Tuesday -->
                            <div class="gcal-time-cell" data-day="tuesday" data-time="8"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="9"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="10"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="11"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="12"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="13"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="14"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="15"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="16"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="17"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="18"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="19"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="20"></div>
                            <div class="gcal-time-cell" data-day="tuesday" data-time="21"></div>

                            <!-- Wednesday -->
                            <div class="gcal-time-cell" data-day="wednesday" data-time="8"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="9"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="10"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="11"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="12"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="13"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="14"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="15"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="16"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="17"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="18"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="19"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="20"></div>
                            <div class="gcal-time-cell" data-day="wednesday" data-time="21"></div>

                            <!-- Thursday -->
                            <div class="gcal-time-cell" data-day="thursday" data-time="8"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="9"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="10"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="11"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="12"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="13"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="14"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="15"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="16"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="17"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="18"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="19"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="20"></div>
                            <div class="gcal-time-cell" data-day="thursday" data-time="21"></div>

                            <!-- Friday -->
                            <div class="gcal-time-cell" data-day="friday" data-time="8"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="9"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="10"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="11"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="12"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="13"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="14"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="15"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="16"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="17"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="18"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="19"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="20"></div>
                            <div class="gcal-time-cell" data-day="friday" data-time="21"></div>

                            <!-- Saturday -->
                            <div class="gcal-time-cell" data-day="saturday" data-time="8"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="9"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="10"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="11"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="12"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="13"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="14"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="15"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="16"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="17"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="18"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="19"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="20"></div>
                            <div class="gcal-time-cell" data-day="saturday" data-time="21"></div>

                            <!-- Sunday -->
                            <div class="gcal-time-cell" data-day="sunday" data-time="8"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="9"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="10"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="11"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="12"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="13"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="14"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="15"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="16"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="17"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="18"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="19"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="20"></div>
                            <div class="gcal-time-cell" data-day="sunday" data-time="21"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="navbar.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
