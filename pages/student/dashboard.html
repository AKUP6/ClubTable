<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yale Clubs - Dashboard</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <!-- Navigation Bar will be inserted by JavaScript -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="dashboard-content">
        <div class="dashboard-page">
            <!-- Header Section -->
            <div class="dashboard-header">
                <h1 class="dashboard-title">Welcome back, Student!</h1>
                <p class="dashboard-subtitle">Here's what's happening with your clubs today.</p>
            </div>

            <!-- Summary Cards -->
            <div class="dashboard-summary-cards">
                <div class="summary-card-dashboard">
                    <div class="summary-icon-dashboard">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="summary-content-dashboard">
                        <div class="summary-label-dashboard">Active Clubs</div>
                        <div class="summary-value-dashboard">0</div>
                    </div>
                </div>

                <div class="summary-card-dashboard">
                    <div class="summary-icon-dashboard">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="summary-content-dashboard">
                        <div class="summary-label-dashboard">Upcoming Events</div>
                        <div class="summary-value-dashboard">0</div>
                    </div>
                </div>

                <div class="summary-card-dashboard">
                    <div class="summary-icon-dashboard">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div class="summary-content-dashboard">
                        <div class="summary-label-dashboard">Pending Applications</div>
                        <div class="summary-value-dashboard">0</div>
                    </div>
                </div>
            </div>

            <!-- Main Content Grid -->
            <div class="dashboard-grid">
                <!-- Left Column - Your Clubs -->
                <div class="dashboard-main-column">
                    <div class="dashboard-section">
                        <div class="section-header-dashboard">
                            <h2 class="section-title-dashboard">Your Clubs</h2>
                            <a href="clubs.html" class="section-link-dashboard">Browse All Clubs</a>
                        </div>

                        <div class="clubs-list-dashboard">
                            <!-- Clubs will be populated by JavaScript -->
                        </div>
                    </div>
                </div>

                <!-- Right Column - Sidebar -->
                <div class="dashboard-sidebar">
                    <!-- Upcoming Events -->
                    <div class="sidebar-section">
                        <h3 class="sidebar-title">Upcoming Events</h3>
                        <div class="event-item">
                            <div class="event-icon">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="event-details">
                                <div class="event-name" style="color: #718096; font-style: italic;">No upcoming events</div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="sidebar-section">
                        <h3 class="sidebar-title">Quick Actions</h3>
                        <div class="quick-actions-list">
                            <a href="clubs.html" class="quick-action-item">
                                <i class="fas fa-search"></i>
                                <span>Browse All Clubs</span>
                            </a>
                            <a href="applications.html" class="quick-action-item">
                                <i class="fas fa-file-alt"></i>
                                <span>View Applications</span>
                            </a>
                            <a href="calendar.html" class="quick-action-item">
                                <i class="fas fa-calendar"></i>
                                <span>View Calendar</span>
                            </a>
                        </div>
                    </div>

                    <!-- Application Deadlines -->
                    <div class="sidebar-section">
                        <h3 class="sidebar-title">Application Deadlines</h3>
                        <div class="deadline-list">
                            <!-- Deadlines will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Club Details Modal -->
    <div id="club-modal" class="club-modal">
        <div class="club-modal-overlay"></div>
        <div class="club-modal-content">
            <div class="club-modal-header">
                <h2 class="club-modal-title" id="club-modal-title">Club Name</h2>
                <button class="club-modal-close" id="club-modal-close" aria-label="Close modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="club-modal-body" id="club-modal-body">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
